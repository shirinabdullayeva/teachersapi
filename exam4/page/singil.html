<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }

        if (localStorage.getItem('theme') === 'dark' ||
            (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        }
    </script>
</head>

<body id="" class="singilpages bg-gray-50 dark:bg-[#0f1629] text-gray-800 dark:text-gray-100 min-h-screen">

    <div class="flex">
            <aside
                class="w-64 bg-white dark:bg-[#141c2f] p-4 border-r border-gray-200 dark:border-gray-700 min-h-screen fixed h-screen z-50 transition-all duration-300">
                <div class="flex items-center justify-between w-full">
                    <div class="flex items-center gap-2">
                        <div
                            class="w-8 h-8 bg-gradient-to-br from-blue-500 to-purple-600 rounded-lg flex items-center justify-center">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                                class="lucide lucide-graduation-cap h-5 w-5 text-white">
                                <path
                                    d="M21.42 10.922a1 1 0 0 0-.019-1.838L12.83 5.18a2 2 0 0 0-1.66 0L2.6 9.08a1 1 0 0 0 0 1.832l8.57 3.908a2 2 0 0 0 1.66 0z">
                                </path>
                                <path d="M22 10v6"></path>
                                <path d="M6 12.5V16a6 3 0 0 0 12 0v-3.5"></path>
                            </svg>
                        </div>
                        <span class="text-gray-900 dark:text-white font-medium text-lg">EduAdmin</span>
                    </div>
            
                    <button
                        class="cursor-pointer inline-flex items-center justify-center h-8 w-8 rounded-full hover:bg-gray-100 dark:hover:bg-gray-700 transition ml-auto">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                            class="lucide lucide-chevron-left h-4 w-4">
                            <path d="m15 18-6-6 6-6"></path>
                        </svg>
                    </button>
                </div>
            
                <div class="border-b border-gray-200 dark:border-gray-700 w-full mt-4"></div>
            
                <nav class="space-y-2 mt-4">
                    <button onclick="switchPage('dashboardPage', this)"
                        class="w-full cursor-pointer flex items-center gap-3 px-4 py-3 rounded-lg text-white bg-gradient-to-r from-blue-500 to-purple-600 shadow-md shadow-blue-500/30 dark:shadow-blue-500/30 transition-all duration-200">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                            class="lucide lucide-layout-dashboard h-5 w-5 flex-shrink-0">
                            <rect width="7" height="9" x="3" y="3" rx="1"></rect>
                            <rect width="7" height="5" x="14" y="3" rx="1"></rect>
                            <rect width="7" height="9" x="14" y="12" rx="1"></rect>
                            <rect width="7" height="5" x="3" y="16" rx="1"></rect>
                        </svg>
                        <span>Dashboard</span>
                    </button>
            
                    <button onclick="switchPage('teachersPage', this)"
                        class="w-full cursor-pointer flex items-center gap-3 px-4 py-3 rounded-lg transition-all duration-200 text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                            class="lucide lucide-users h-5 w-5 flex-shrink-0">
                            <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
                            <path d="M16 3.128a4 4 0 0 1 0 7.744"></path>
                            <path d="M22 21v-2a4 4 0 0 0-3-3.87"></path>
                            <circle cx="9" cy="7" r="4"></circle>
                        </svg>
                        <span>Teachers</span>
                    </button>
            
                    <button onclick="switchPage('studentsPage', this)"
                        class="w-full cursor-pointer flex items-center gap-3 px-4 py-3 rounded-lg text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 transition-all duration-200">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                            class="lucide lucide-graduation-cap h-5 w-5 flex-shrink-0">
                            <path
                                d="M21.42 10.922a1 1 0 0 0-.019-1.838L12.83 5.18a2 2 0 0 0-1.66 0L2.6 9.08a1 1 0 0 0 0 1.832l8.57 3.908a2 2 0 0 0 1.66 0z">
                            </path>
                            <path d="M22 10v6"></path>
                            <path d="M6 12.5V16a6 3 0 0 0 12 0v-3.5"></path>
                        </svg>
                        <span>Students</span>
                    </button>
            
                    <button onclick="switchPage('settingsPage', this)"
                        class="w-full cursor-pointer flex items-center gap-3 px-4 py-3 rounded-lg transition-all duration-200 text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                            class="lucide lucide-settings h-5 w-5 flex-shrink-0">
                            <path
                                d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z">
                            </path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                        <span>Settings</span>
                    </button>
                </nav>
            </aside>
            
            <div class="flex-1 flex flex-col ml-64 transition-all duration-300" id="mainContent">
                <header
                    class="bg-white dark:bg-[#141c2f] border-b border-gray-200 dark:border-gray-700 px-8 py-4 flex items-center justify-between sticky top-0 z-10 transition-colors duration-300">
                    <div class="flex items-center gap-4">
                        <h1 class="text-gray-900 dark:text-white text-2xl font-bold">School Management System</h1>
                    </div>
            
                    <button id="themeToggle"
                        class="flex items-center justify-center p-2 rounded-full bg-gray-200 dark:bg-gray-700 text-gray-800 dark:text-gray-100 hover:bg-gray-300 dark:hover:bg-gray-600 transition-colors duration-200">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-sun h-6 w-6">
                            <circle cx="12" cy="12" r="4"></circle>
                            <path d="M12 2v2"></path>
                            <path d="M12 20v2"></path>
                            <path d="m4.93 4.93 1.41 1.41"></path>
                            <path d="m17.66 17.66 1.41 1.41"></path>
                            <path d="M2 12h2"></path>
                            <path d="M20 12h2"></path>
                            <path d="m6.34 17.66-1.41 1.41"></path>
                            <path d="m19.07 4.93-1.41 1.41"></path>
                        </svg>
                    </button>
                </header>
   
      

  
      
            
<main  class=" max-w-7xl mx-auto px-6 py-8">
    <!-- breadcrumb + back -->
    <div class="mb-6 text-sm text-gray-600 flex items-center gap-4">
        <a href="../index.html" class="flex items-center gap-2 hover:underline">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
            </svg>
            Back to Teachers
        </a>

        <nav class="text-gray-400"> / Dashboard / Teachers / <span class="text-gray-700"
                id="breadcrumbName">Teacher</span></nav>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        <!-- LEFT: profile card -->
        <aside class="lg:col-span-1 bg-white rounded-2xl shadow p-6">
            <div class="flex flex-col items-center">
                <div class="w-36 h-36 rounded-full overflow-hidden ring-4 ring-blue-50 shadow">
                    <img src="" alt="Teacher" id="profileAvatar" class="w-full h-full object-cover">
                </div>

                <h2 class="mt-4 text-lg font-semibold" id="profileName">Teacher Name</h2>
                <span class="mt-2 inline-block bg-gray-100 text-gray-700 text-xs px-3 py-1 rounded-full"
                    id="profileSubject">Subject</span>

                <div class="w-full mt-6 text-sm text-gray-600">
                    <div class="flex justify-between py-2">
                        <div>Age</div>
                        <div class="font-medium text-gray-800" id="profileAge">--</div>
                    </div>
                    <div class="flex justify-between py-2">
                        <div>Experience</div>
                        <div class="font-medium text-gray-800" id="profileExp">--</div>
                    </div>
                    <div class="flex justify-between py-2">
                        <div>Gender</div>
                        <div class="font-medium text-gray-800" id="profileGender">--</div>
                    </div>

                    <div class="flex items-center justify-between py-2">
                        <div class="flex items-center gap-2">
                            <svg class="w-4 h-4 text-yellow-400" viewBox="0 0 24 24" fill="currentColor">
                                <path
                                    d="M12 17.3l6.18 3.73-1.64-7.03L21 9.24l-7.19-.61L12 2 10.19 8.63 3 9.24l4.46 4.76L5.82 21z" />
                            </svg>
                            <span>Rating</span>
                        </div>
                        <div class="font-medium text-gray-800" id="profileRating">--</div>
                    </div>

                    <div class="mt-3">
                        <div class="w-full bg-gray-200 rounded-full h-2 overflow-hidden">
                            <div id="ratingBar" class="h-2 rounded-full" style="width:0%; background:#0b1220;"></div>
                        </div>
                    </div>

                    <div class="mt-6">
                        <button
                            class="w-full bg-black text-white py-3 rounded-xl flex items-center justify-center gap-2 hover:brightness-105">
                            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                                <path d="M3 21l3-1 11-11 1-3L14 3 3 14v7z" />
                            </svg>
                            Edit Profile
                        </button>
                    </div>
                </div>
            </div>
        </aside>

    <section class="lg:col-span-2 bg-white rounded-2xl shadow overflow-hidden">
        <!-- Tabs -->
        <div class="p-4 border-b">
            <div class="max-w-6xl mx-auto flex items-center gap-4">
                <button class="tab-btn px-6 py-2 rounded-full text-sm font-medium bg-gray-100 tab-active"
                    data-tab="contact">Contact Info</button>
                <button class="tab-btn px-6 py-2 rounded-full text-sm font-medium text-gray-500"
                    data-tab="assigned">Assigned Students</button>
            </div>
        </div>
    
        <!-- Tabs content -->
        <div class="p-6 max-w-6xl mx-auto grid grid-cols-1 md:grid-cols-2 gap-6" id="tabsContainer">
            <!-- CONTACT PANEL (bitta) -->
            <div data-panel="contact" class="panel">
                <div class="p-4 rounded-xl glass flex items-center gap-4">
                    <div class="p-3 bg-white rounded-lg shadow-sm">
                        <svg class="w-6 h-6 text-indigo-600" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <path
                                d="M22 16.92V21a1 1 0 0 1-1.11 1 19.86 19.86 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.86 19.86 0 0 1 2 3.11 1 1 0 0 1 3 2h4.09a1 1 0 0 1 1 .75 12.05 12.05 0 0 0 .7 2.81 1 1 0 0 1-.25 1.02L7.11 8.89a16 16 0 0 0 6 6l1.31-1.31a1 1 0 0 1 1.02-.25 12.05 12.05 0 0 0 2.81.7 1 1 0 0 1 .75 1V22z" />
                        </svg>
                    </div>
                    <div class="flex-1">
                        <div class="text-sm text-gray-500">Phone</div>
                        <div class="text-gray-800 font-medium" id="contactPhone"></div>
                    </div>
                </div>
    
                <div class="p-4 rounded-xl glass flex items-center gap-4 mt-4">
                    <div class="p-3 bg-white rounded-lg shadow-sm">
                    <svg class="lucide lucide-send h-4 w-4 text-blue-400" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                        <path
                            d="M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11z">
                        </path>
                        <path d="m21.854 2.147-10.94 10.939"></path>
                    </svg>
                    </div>
                    <div class="flex-1">
                        <div class="text-sm text-gray-500">Telegram</div>
                        <div class="text-gray-800 font-medium" id="contactTelegram"></div>
                    </div>
                </div>
    
                <div class="p-4 rounded-xl glass flex items-center gap-4 mt-4">
                    <div class="p-3 bg-white rounded-lg shadow-sm">
                    <svg class="lucide lucide-mail h-4 w-4 text-green-500" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                        <path d="m22 7-8.991 5.727a2 2 0 0 1-2.009 0L2 7"></path>
                        <rect x="2" y="4" width="20" height="16" rx="2"></rect>
                    </svg>
                    </div>
                    <div class="flex-1">
                        <div class="text-sm text-gray-500">Email</div>
                        <div class="text-gray-800 font-medium" id="contactEmail"></div>
                    </div>
                </div>
    
                <div class="p-4 rounded-xl glass flex items-center gap-4 mt-4">
                    <div class="p-3 bg-white rounded-lg shadow-sm">
                        <svg class="lucide lucide-linkedin h-4 w-4 text-blue-600" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                            <path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"></path>
                            <rect width="4" height="12" x="2" y="9"></rect>
                            <circle cx="4" cy="4" r="2"></circle>
                        </svg>
                    </div>
                    <div class="flex-1">
                        <div class="text-sm text-gray-500">LinkedIn</div>
                        <div class="text-gray-800 font-medium" id="contactLinkedIn"></div>
                    </div>
                </div>
            </div>
    
          
            <div data-panel="assigned" class="panel hidden col-span-1 md:col-span-2" id="assignedPanel">
                <div class="p-6 rounded-xl border border-dashed border-gray-200 text-gray-600 text-center">
                    <div class="font-medium text-gray-800">Assigned Students</div>
                    <p class="mt-2 text-sm">Loading...</p>
                </div>
            </div>
        </div>
    </section>
    
        </div>
    </div>
    <script src="../js/singil.js"></script>
<script src="../js/main.js"></script>
<script src="../js/student.id.js"></script>
<script src="../js/teachersid.js"></script>

</body>

</html>
